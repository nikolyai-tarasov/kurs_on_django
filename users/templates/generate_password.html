{% extends 'base.html' %}

{% block title %} Список товаров {% endblock %}
{% load my_tags %}
{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}
    <div class="errorlist">
        {{ form.errors }}
    </div>
    {% endif %}
    <button type="submit">Отправить</button>
</form>
{% include 'header.html' %}
{%endblock%}
